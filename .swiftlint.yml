#only_rules:
#- trailing_newline
#- leading_whitespace
#- duplicate_imports
#- comment_spacing

reporter: "xcode"

excluded:
- Carthage
- Pods
- SwiftLint/Common/3rdPartyLib

disabled_rules:
- trailing_whitespace
- multiple_closures_with_trailing_closure
- function_parameter_count
- unused_closure_parameter
- identifier_name
- type_name
- line_length
- for_where
- colon
- trailing_comma
- opening_brace

#line_length:
#    warning: 150
#    error: 1000
#    ignores_function_declarations: true
#    ignores_comments: true
#    ignores_urls: true

function_body_length:
    warning: 300
    error: 500

#function_parameter_count:
#    warning: 6
#    error: 8

type_body_length:
    warning: 300
    error: 500

file_length:
    warning: 1000
    error: 1500
    ignore_comment_only_lines: true

cyclomatic_complexity:
    warning: 15
    error: 25

